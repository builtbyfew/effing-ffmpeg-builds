name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "FFmpeg version to build (e.g. 6.1.4)"
        required: true
        type: string
      revision:
        description: "Build revision, for rebuilding the same FFmpeg version with updated dependencies (e.g. 1 publishes tag v6.1.4-1). Leave empty for the first build of a version."
        required: false
        type: string
        default: ""
      overwrite:
        description: "Delete and recreate the release if it already exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Release tag and title. A revision gets its own tag so published releases
# are never replaced: @effing/ffmpeg pins checksums per release, and swapping
# the binaries under an existing tag breaks every install of it.
run-name: Release v${{ inputs.version }}${{ inputs.revision && format('-{0}', inputs.revision) || '' }}

env:
  # Alpine only supplies the toolchain for the Linux builds: build.sh compiles
  # libx264 and mbedTLS from source, so any recent Alpine release works here.
  ALPINE_IMAGE: alpine:3.22

jobs:
  # Fail fast on malformed inputs instead of after the builds.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check version and revision
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -eu
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] \
            || { echo "version must look like 6.1 or 6.1.4" >&2; exit 1; }
          case "$REVISION" in
            ""|[1-9]|[1-9][0-9]) ;;
            *) echo "revision must be empty or a number from 1 to 99" >&2; exit 1 ;;
          esac

  build-linux:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build in Alpine container
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e VERSION -e ARCH "$ALPINE_IMAGE" sh -c '
            set -e
            apk add --no-cache build-base cmake nasm coreutils curl tar xz git pkgconfig bash zlib-dev zlib-static
            ./build.sh "$VERSION" "ffmpeg-linux-$ARCH"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux-${{ matrix.arch }}
          path: ffmpeg-linux-${{ matrix.arch }}
          if-no-files-found: error

  build-darwin-x64:
    needs: validate
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: brew install nasm cmake
      - name: Build
        run: ./build.sh "${{ inputs.version }}" ffmpeg-darwin-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-darwin-x64
          path: ffmpeg-darwin-x64
          if-no-files-found: error

  build-darwin-arm64:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: brew install nasm cmake
      - name: Build
        run: ./build.sh "${{ inputs.version }}" ffmpeg-darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-darwin-arm64
          path: ffmpeg-darwin-arm64
          if-no-files-found: error

  build-win32-x64:
    needs: validate
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # mbedtls is built from source by build.sh (pinned MBEDTLS_VERSION),
          # as on Linux and macOS, so cmake and ninja are needed here.
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-zlib
            git
      - name: Build
        env:
          VERSION: ${{ inputs.version }}
        run: ./build.sh "$VERSION" ffmpeg-win32-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win32-x64
          path: ffmpeg-win32-x64
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-darwin-x64
      - build-darwin-arm64
      - build-win32-x64
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Gzip binaries and fetch LICENSE
        run: |
          set -eux
          cd artifacts
          ls -lh
          for f in ffmpeg-darwin-arm64 ffmpeg-darwin-x64 ffmpeg-linux-arm64 ffmpeg-linux-x64 ffmpeg-win32-x64; do
            chmod +x "$f"
            gzip --best -k "$f"
          done
          curl -fL -o LICENSE.txt \
            "https://git.ffmpeg.org/gitweb/ffmpeg.git/blob_plain/n${{ inputs.version }}:/LICENSE.md"
          ls -lh

      - name: Delete existing release and tag (if overwrite)
        if: ${{ inputs.overwrite }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -eu
          TAG="v${VERSION}${REVISION:+-$REVISION}"
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -eux
          TAG="v${VERSION}${REVISION:+-$REVISION}"
          cd artifacts
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "FFmpeg ${VERSION}${REVISION:+ (build $REVISION)}" \
            --notes "Static FFmpeg ${VERSION} builds for darwin-x64, darwin-arm64, linux-x64 (musl), linux-arm64 (musl), win32-x64. Built from source on GitHub-hosted runners${REVISION:+ (build revision $REVISION: same FFmpeg source, rebuilt with the dependency pins in build.sh at $GITHUB_SHA)}. Licensed under GPLv3 (includes libx264); see LICENSE.txt." \
            ffmpeg-darwin-arm64 \
            ffmpeg-darwin-arm64.gz \
            ffmpeg-darwin-x64 \
            ffmpeg-darwin-x64.gz \
            ffmpeg-linux-arm64 \
            ffmpeg-linux-arm64.gz \
            ffmpeg-linux-x64 \
            ffmpeg-linux-x64.gz \
            ffmpeg-win32-x64 \
            ffmpeg-win32-x64.gz \
            LICENSE.txt
